worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    map $arg_a $depscout_latest {
        default "";
        "guava" "33.4.0";
        "spring-boot-gradle-plugin" "3.4.1";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        charset utf-8;
        autoindex on;

        location = /artifactory/api/search/latestVersion {
            default_type text/plain;
            if ($depscout_latest = "") {
                return 404;
            }
            return 200 "$depscout_latest\n";
        }

        location /artifactory/public/ {
            autoindex on;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
