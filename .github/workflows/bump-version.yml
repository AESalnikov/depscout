name: bump-version

# После мержа в main создаёт следующий patch-тег (vX.Y.Z).
# Тег пушится PAT (HOMEBREW_TAP_GITHUB_TOKEN), иначе GITHUB_TOKEN не
# триггерит release.yml (ограничение GitHub Actions).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Create or bump semver tag
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged: $(git describe --exact-match --tags HEAD)"
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1 || true)"
          if [ -z "${latest}" ]; then
            ver="$(sed -n 's/^var Version = "\([^"]*\)"/\1/p' version.go | head -1)"
            if [ -z "${ver}" ]; then
              ver="0.1.0"
            fi
            next="v${ver}"
            echo "No tags yet → ${next}"
          else
            raw="${latest#v}"
            IFS=. read -r major minor patch <<<"${raw}"
            next="v${major}.${minor}.$((patch + 1))"
            echo "Bump ${latest} → ${next}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${next}" -m "${next}"
          git push origin "${next}"
